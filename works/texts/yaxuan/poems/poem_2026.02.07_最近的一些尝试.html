<div class="chinese">
<pre class="yaxuan-poem-chinese">
<b>最近的一些尝试</b>

最近尝试在文字里找声音
在颜色里找动静
在声音里找沉默
却什么也没找到
什么也没有

2026.02.07
</pre>
</div>

<div class="french">
<pre class="yaxuan-poem-francais">
<b>Quelques tentatives récentes</b>

J’ai cherché des voix parmi les mots
des mouvements parmi les couleurs
du silence parmi les sons
et n’ai rien trouvé 
rien trouvé du tout

2026.02.07

</pre>
